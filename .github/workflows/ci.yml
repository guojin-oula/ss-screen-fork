name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install core test environment
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run black --check .
      - name: Test
        run: uv run pytest -q
