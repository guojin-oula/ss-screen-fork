[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ssscreen-web"
version = "0.1.0"
description = "SS-Screen multi-user Web control plane"
requires-python = ">=3.11"
dependencies = [
    "ss-screen[condense]",
    "alembic>=1.13,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.12,<1",
    "sqlalchemy>=2.0.36,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "black>=24.10",
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ssscreen_web"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]  # FastAPI dependency injection uses callable defaults by design.

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
