[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ss-screen"
version = "1.0"
description = "Screen materials pairs that form solid-solutions (alloys) with tunable band gaps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HC project" }]
keywords = ["materials-science", "solid-solution", "band-gap", "screening", "pymatgen"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pymatgen>=2024.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "monty>=2024.0",
    "click>=8.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
# robocrys is only required for the `condense` workflow (M2), not for the
# pair-screening core which consumes pre-condensed JSON.
condense = [
    "robocrys>=0.2",
    # robocrys/matminer still import pkg_resources; setuptools 81+ removes it.
    "setuptools<81",
    # matminer 0.8 imports pymatgen private names removed by modern pymatgen.
    "matminer>=0.10.1",
]
# Official Materials Project live API backend. The default MP loader uses the
# separately installed/local `mp_offline` package for network-isolated runs.
mp = ["mp-api>=0.46.4,<0.47"]
# WBM extxyz loading.
wbm = ["ase>=3.22"]
# Optimized SQS generation backend for Stage 6.
sqs = ["ase>=3.22", "icet>=3.2"]
# Optional PySide6 desktop workbench. The GUI remains a thin launcher over the
# real Click CLI so `ss-screen` keeps the authoritative scientific behavior.
gui = ["PySide6>=6.5,<7"]
# Stage 7 MLP relaxation. These pins reproduce the validated MACE-MPA-0 runtime;
# install the desired CUDA build of torch before installing this extra.
mlp = [
    "numpy>=1.26,<2",
    "ase>=3.23,<3.27",
    "torch==2.5.1",
    "matscipy==1.1.1",
    "mace-torch==0.3.14",
]
# Stage 9 harmonic phonons. Install together with `mlp` for direct MACE forces.
phonon = [
    "phonopy>=4.3,<5",
    "seekpath>=2.1",
    "h5py>=3.10",
    "matplotlib>=3.8",
]
[dependency-groups]
dev = [
    "pytest>=7",
    "ruff",
    "black",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
ss-screen = "ssscreen.cli.app:cli"
ss-screen-gui = "ssscreen.gui.launcher:main"

[project.urls]
Documentation = "https://github.com/bonan/HC/ss-screen/docs/PROJECT_PLAN.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ssscreen"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
